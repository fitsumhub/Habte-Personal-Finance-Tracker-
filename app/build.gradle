plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing secrets live outside version control (see .gitignore) in a
// keystore.properties file at the repo root. Loaded here rather than committed so the
// signing key/passwords never end up in git history — see keystore.properties.example
// for the format anyone re-creating this file needs to follow.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.fitsumhub.habtetracker"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Falls back to unsigned on a machine without keystore.properties (e.g. a
            // fresh clone or CI without the secret) instead of failing the build outright.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

}

    dependencies {
        // Core
        implementation 'androidx.core:core-ktx:1.12.0'
        implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
        implementation 'androidx.activity:activity-compose:1.8.2'
        implementation 'io.coil-kt:coil-compose:2.5.0'

    // Jetpack Compose BOM — keeps all Compose versions aligned
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // Material Icons Extended (for TrendingUp, Shield, FileDownload, etc.)
    implementation 'androidx.compose.material:material-icons-extended'

    // Material Components (for XML themes)
    implementation 'com.google.android.material:material:1.11.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Biometric Security
    implementation 'androidx.biometric:biometric-ktx:1.2.0-alpha05'

    // Window insets (statusBarsPadding, imePadding)
    implementation 'androidx.compose.foundation:foundation'

    // Room — local persistence for transactions/banks/accounts/budgets
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Google Mobile Ads (AdMob) — banner/interstitial/rewarded/native ad formats.
    // See com.mobile.ads.AdMobConfig for the (currently test-only) ad unit IDs.
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    // User Messaging Platform — gathers GDPR/CCPA ad consent before any ad request, a
    // required step (not just an EEA/UK nicety) for a real AdMob release. See AdMobConsent.
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
