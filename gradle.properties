android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx1536m -XX:+UseG1GC -Dfile.encoding=UTF-8
android.defaults.buildfeatures.resvalues=true
